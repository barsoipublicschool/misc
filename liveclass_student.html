<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Barsoi Public School</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">

    <!-- 1. AUTHENTICATION SECTION (LOGIN / REGISTER TABS) -->
    <div id="authSection" class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="bg-gray-800 border border-gray-700 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <div class="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-100">Student Portal</h2>
                <p class="text-gray-400 text-xs mt-1">Barsoi Public School Online Learning</p>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b border-gray-700 mb-6">
                <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400 focus:outline-none transition">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
                </button>
                <button id="registerTabBtn" onclick="switchTab('register')" class="flex-1 py-2 text-center text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 focus:outline-none transition">
                    <i class="fa-solid fa-user-plus mr-1"></i> Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">MOBILE OR EMAIL</label>
                    <input type="text" id="loginUser" required placeholder="Registered Mobile/Email" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">PASSWORD / PIN</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Login to Portal
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">FULL NAME</label>
                    <input type="text" id="regName" required placeholder="Apna Poora Naam" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">EMAIL ADDRESS</label>
                    <input type="email" id="regEmail" required placeholder="example@gmail.com" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">MOBILE NUMBER</label>
                    <input type="tel" id="regMobile" required placeholder="10 Digit Mobile Number" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">SET PASSWORD / PIN</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" id="regBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-user-check"></i> Register Student
                </button>
            </form>
        </div>
    </div>

    <!-- 2. STUDENT DASHBOARD SECTION (LOGIN KE BAAD) -->
    <div id="portalSection" class="hidden">
        <!-- Header -->
        <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg text-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="font-bold text-lg tracking-wide">ClassWalla Student</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="studentWelcome" class="text-sm font-medium text-gray-300">Welcome, Student</span>
                <button onclick="logout()" class="bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-700 text-xs px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-power-off mr-1"></i> Logout
                </button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 py-8">
            <h2 class="text-xl font-bold text-gray-100 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-book-bookmark text-blue-500"></i> My Enrolled Courses
            </h2>

            <div id="studentCourseList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Courses Auto-render JS dwara -->
            </div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzmJCm8lFBGQbMGMyQuJ1hcOoLfjkP5Kc_wuKBGCuy3DRzYg7jdtyLX9H5iZflfgvb_Pg/exec";
        let loggedInStudent = null;

        // Auto Login Check
        window.addEventListener("DOMContentLoaded", () => {
            const savedStudent = localStorage.getItem("cw_student");
            if (savedStudent) {
                loggedInStudent = JSON.parse(savedStudent);
                showPortal();
            }
        });

        // Tab Switching (Login <-> Register)
        function switchTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const loginBtn = document.getElementById("loginTabBtn");
            const registerBtn = document.getElementById("registerTabBtn");

            if (tab === 'login') {
                loginForm.classList.remove("hidden");
                registerForm.classList.add("hidden");
                loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400 focus:outline-none transition";
                registerBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 focus:outline-none transition";
            } else {
                loginForm.classList.add("hidden");
                registerForm.classList.remove("hidden");
                registerBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-green-500 text-green-400 focus:outline-none transition";
                loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 focus:outline-none transition";
            }
        }

        // 1. Student Login Logic
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking...`;
            btn.disabled = true;

            const userVal = document.getElementById("loginUser").value.trim();
            const passVal = document.getElementById("loginPass").value.trim();

            try {
                const response = await fetch(`${API_URL}?action=getStudents`);
                const students = await response.json();

                // Check Matching Credentials from Google Sheets (FullName, Email, Mobile, Password)
                const match = students.find(s => 
                    (String(s.Email).trim() == userVal || String(s.Mobile).trim() == userVal) && String(s.Password).trim() == passVal
                );

                if (match) {
                    loggedInStudent = match;
                    localStorage.setItem("cw_student", JSON.stringify(match));
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Successful!',
                        text: `Welcome back, ${match.FullName || match.Name || 'Student'}`,
                        background: '#1f2937',
                        color: '#fff',
                        timer: 1500,
                        showConfirmButton: false
                    });

                    showPortal();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: 'Invalid Mobile/Email ya Password!',
                        background: '#1f2937',
                        color: '#fff'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Server Error',
                    text: 'Google Sheet Database connect nahi ho saka.',
                    background: '#1f2937',
                    color: '#fff'
                });
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login to Portal`;
                btn.disabled = false;
            }
        }

        // 2. Student Register Logic (Saves to `Students` Sheet)
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("regBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Registering...`;
            btn.disabled = true;

            const payload = {
                action: "addStudent",
                payload: {
                    name: document.getElementById("regName").value.trim(),
                    email: document.getElementById("regEmail").value.trim(),
                    mobile: document.getElementById("regMobile").value.trim(),
                    password: document.getElementById("regPassword").value.trim()
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registration Successful!',
                        text: `Your Student ID: ${result.studentId || 'Created'}. Ab aap Login kar sakte hain!`,
                        background: '#1f2937',
                        color: '#fff'
                    });
                    
                    document.getElementById("registerForm").reset();
                    switchTab('login');
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Registration Error',
                        text: result.message || 'Error occurred',
                        background: '#1f2937',
                        color: '#fff'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Registration Failed',
                    text: 'Server tak data nahi bheja ja saka.',
                    background: '#1f2937',
                    color: '#fff'
                });
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-user-check"></i> Register Student`;
                btn.disabled = false;
            }
        }

        // 3. Show Dashboard
        function showPortal() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("portalSection").classList.remove("hidden");
            document.getElementById("studentWelcome").innerText = `Hi, ${loggedInStudent.FullName || loggedInStudent.Name || 'Student'}`;
            loadStudentCourses();
        }

        // 4. Load Enrolled Courses
        async function loadStudentCourses() {
            const container = document.getElementById("studentCourseList");
            container.innerHTML = `<p class="col-span-3 text-center text-gray-400 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-500"></i><br>Loading your courses...</p>`;

            try {
                const response = await fetch(`${API_URL}?action=getCourses`);
                const allCourses = await response.json();

                if (allCourses.length === 0) {
                    container.innerHTML = `<p class="col-span-3 text-center text-gray-400 py-10">Abhi koi course uplabdh nahi hai.</p>`;
                    return;
                }

                container.innerHTML = allCourses.map(course => `
                    <div class="bg-gray-800 rounded-2xl border border-gray-700 overflow-hidden shadow-lg hover:border-gray-600 transition">
                        <img src="${course.ThumbnailURL || 'https://via.placeholder.com/300x150?text=Course+Thumbnail'}" class="w-full h-40 object-cover">
                        <div class="p-5">
                            <span class="text-xs bg-blue-900 text-blue-300 px-2.5 py-1 rounded-md font-semibold">${course.Category || 'General'}</span>
                            <h3 class="font-bold text-lg mt-2 text-gray-100">${course.Title}</h3>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${course.Description || ''}</p>
                            
                            <button onclick="viewLectures('${course.CourseID}')" class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-circle-play"></i> Watch Lectures & Notes
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = `<p class="col-span-3 text-center text-red-400 py-10">Courses load karne me dikkat hui.</p>`;
            }
        }

        // 5. Open Course Classroom
        function viewLectures(courseId) {
            window.location.href = `liveclass_learn.html?courseId=${courseId}`;
        }

        // 6. Logout
        function logout() {
            localStorage.removeItem("cw_student");
            location.reload();
        }
    </script>
</body>
</html>
