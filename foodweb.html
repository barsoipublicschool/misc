    // Context Setup
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [cart, setCart] = useState([]);
      const [user, setUser] = useState({ name: 'Demo Customer', role: 'customer', email: 'customer@foodexpress.demo' });
      const [currentRoute, setCurrentRoute] = useState('home'); // home, search, cart, checkout, success, admin, restaurantAdmin
      const [activeProductModal, setActiveProductModal] = useState(null);
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [lastOrderId, setLastOrderId] = useState('ORD-849201');

      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === product.id);
          if (exists) {
            return prev.map(i => i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => {
          if (i.product.id === id) {
            const newQty = i.qty + delta;
            return newQty > 0 ? { ...i, qty: newQty } : null;
          }
          return i;
        }).filter(Boolean));
      };

      const clearCart = () => {
        setCart([]);
        setAppliedCoupon(null);
      };

      const subtotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
      const deliveryFee = cart.length > 0 ? 40 : 0;
      const tax = Math.round(subtotal * 0.05);

      let discount = 0;
      if (appliedCoupon) {
        if (appliedCoupon === 'WELCOME50') discount = Math.min(Math.round(subtotal * 0.5), 100);
        if (appliedCoupon === 'FOOD20') discount = Math.min(Math.round(subtotal * 0.2), 150);
        if (appliedCoupon === 'SAVE100' && subtotal >= 499) discount = 100;
      }

      const grandTotal = Math.max(0, subtotal + deliveryFee + tax - discount);

      return (
        <AppContext.Provider value={{
          cart, addToCart, updateQty, clearCart, user, setUser,
          currentRoute, setCurrentRoute, activeProductModal, setActiveProductModal,
          subtotal, deliveryFee, tax, discount, grandTotal, appliedCoupon, setAppliedCoupon,
          selectedCategory, setSelectedCategory, lastOrderId, setLastOrderId
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // ==========================================
    // COMPONENTS
    // ==========================================

    const Header = () => {

              </div>
            </div>

            {/* Navigation Buttons */}
            <div className="flex items-center gap-3">

              </button>

              <button 
                onClick={() => setCurrentRoute('cart')}
                className="relative p-2 text-slate-600 hover:text-emerald-600 transition"
              >
                <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                {totalCount > 0 && (
                  <span className="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">
                    {totalCount}
                  </span>
                )}
              </button>

              {/* Demo Login Switcher */}
              <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-slate-700">
                <button 
                  onClick={() => { setUser({ name: 'Customer', role: 'customer' }); setCurrentRoute('home'); }} 
                  className={`px-2 py-1 rounded-lg ${user.role === 'customer' ? 'bg-white shadow text-emerald-600' : ''}`}
                >
                  User
                </button>
                <button 
                  onClick={() => { setUser({ name: 'Restaurant', role: 'restaurant' }); setCurrentRoute('restaurantAdmin'); }} 
                  className={`px-2 py-1 rounded-lg ${user.role === 'restaurant' ? 'bg-white shadow text-emerald-600' : ''}`}

                </button>
                <button

                  className={`px-2 py-1 rounded-lg ${user.role === 'admin' ? 'bg-white shadow text-emerald-600' : ''}`}
                >

                </button>

      );

    const FoodCard = ({ product }) => {
      const { addToCart, cart, updateQty, setActiveProductModal } = useApp();
      const inCart = cart.find(i => i.product.id === product.id);

      return (
        <div className="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">

                src={product.image} 
                alt={product.name} 
                className="w-full h-full object-cover hover:scale-105 transition duration-300"
                onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80'; }}
              />
              <span className={`absolute top-2 left-2 px-2 py-0.5 text-[9px] font-bold rounded uppercase tracking-wider text-white ${product.isVeg ? 'bg-emerald-600' : 'bg-red-600'}`}>
                {product.isVeg ? 'VEG' : 'NON-VEG'}
              </span>
              {product.discount > 0 && (
                <span className="absolute top-2 right-2 bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
                  {product.discount}% OFF
                </span>
              )}
            </div>

            <div className="flex justify-between items-start mb-1">
              <h3 className="font-bold text-slate-900 text-sm line-clamp-1">{product.name}</h3>
              <span className="bg-emerald-50 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5">
                ★ {product.rating}
              </span>
            </div>
            <p className="text-[11px] text-slate-500 line-clamp-2 mb-3">{product.desc}</p>
          </div>

          <div className="flex items-center justify-between pt-2 border-t border-slate-50">
            <div>
              <span className="font-extrabold text-slate-900 text-sm">₹{product.price}</span>
            </div>

            {inCart ? (
              <div className="flex items-center gap-2 bg-emerald-600 text-white rounded-lg px-2 py-1 text-xs font-bold shadow-sm">
                <button onClick={() => updateQty(product.id, -1)} className="px-1">-</button>
                <span>{inCart.qty}</span>
                <button onClick={() => updateQty(product.id, 1)} className="px-1">+</button>
              </div>
            ) : (
              <button 
                onClick={() => addToCart(product)}
                className="bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs"
              >
                + ADD
              </button>
            )}
          </div>
        </div>
      );
    };

    // ==========================================
    // PAGES
    // ==========================================

    const HomePage = () => {
      const { setCurrentRoute, setSelectedCategory } = useApp();

      const categories = [
        { name: 'Pizza', icon: '🍕' },
        { name: 'Burger', icon: '🍔' },
        { name: 'Biryani', icon: '🍲' },
        { name: 'Chinese', icon: '🥢' },
        { name: 'South Indian', icon: '🥘' },
        { name: 'Desserts', icon: '🍰' },
        { name: 'Beverages', icon: '🥤' }
      ];

      return (
        <div className="pb-16">
          {/* Hero Banner */}
          <section className="bg-gradient-to-r from-emerald-800 to-teal-900 text-white py-12 px-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8">
              <div className="space-y-4 max-w-lg">
                <span className="px-3 py-1 bg-emerald-500/30 text-emerald-200 text-xs font-bold rounded-full border border-emerald-400/20">
                  ⚡ 30 Min Express Delivery
                </span>
                <h1 className="text-3xl sm:text-5xl font-black leading-tight">
                  Delicious Food, <br /><span className="text-orange-400">Delivered To Your Door.</span>
                </h1>
                <p className="text-emerald-100 text-sm">Order from top restaurants near you with real-time tracking.</p>
                <button 
                  onClick={() => setCurrentRoute('search')} 
                  className="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg transition"
                >
                  Explore Dishes
                </button>
              </div>
              <div className="w-full md:w-1/2 max-w-md">
                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80" className="rounded-3xl shadow-2xl h-64 object-cover w-full" />
              </div>
            </div>
          </section>

          {/* Categories */}
          <section className="max-w-7xl mx-auto px-4 py-8">
            <h2 className="text-lg font-bold text-slate-900 mb-4">Popular Categories</h2>
            <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2">
              {categories.map((c, i) => (
                <div 
                  key={i} 
                  onClick={() => { setSelectedCategory(c.name); setCurrentRoute('search'); }}
                  className="flex flex-col items-center justify-center min-w-[90px] p-4 bg-white rounded-2xl border border-slate-100 shadow-sm hover:border-emerald-500 cursor-pointer transition"
                >
                  <span className="text-3xl mb-1">{c.icon}</span>
                  <span className="text-xs font-bold text-slate-800">{c.name}</span>
                </div>
              ))}
            </div>
          </section>

          {/* Restaurants */}
          <section className="max-w-7xl mx-auto px-4 py-6">
            <h2 className="text-lg font-bold text-slate-900 mb-4">Top Rated Restaurants</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {DEMO_RESTAURANTS.slice(0, 6).map(r => (
                <div key={r.id} className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition">
                  <img src={r.coverImage} className="w-full h-36 object-cover" />
                  <div className="p-4 space-y-2">
                    <div className="flex justify-between items-start">
                      <h3 className="font-extrabold text-slate-900 text-base">{r.name}</h3>
                      <span className="bg-emerald-50 text-emerald-700 text-xs font-bold px-2 py-0.5 rounded">★ {r.rating}</span>
                    </div>
                    <p className="text-xs text-slate-500">{r.cuisine}</p>
                    <div className="flex items-center gap-4 text-[11px] text-slate-500 pt-2 border-t border-slate-50 font-semibold">
                      <span>🕒 {r.time}</span>
                      <span>🚴 ₹{r.fee} Delivery</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Popular Dishes */}
          <section className="max-w-7xl mx-auto px-4 py-6">
            <h2 className="text-lg font-bold text-slate-900 mb-4">Popular Dishes</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              {DEMO_PRODUCTS.slice(0, 8).map(p => (
                <FoodCard key={p.id} product={p} />
              ))}
            </div>
          </section>
        </div>
      );
    };

    const SearchPage = () => {
      const { selectedCategory, setSelectedCategory } = useApp();
      const [searchTerm, setSearchTerm] = useState('');
      const [filterVeg, setFilterVeg] = useState('ALL');

      const filtered = DEMO_PRODUCTS.filter(p => {
        const matchesCategory = selectedCategory === 'All' || p.category.toLowerCase() === selectedCategory.toLowerCase();
        const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.restaurantName.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesVeg = filterVeg === 'ALL' || (filterVeg === 'VEG' && p.isVeg) || (filterVeg === 'NONVEG' && !p.isVeg);
        return matchesCategory && matchesSearch && matchesVeg;
      });

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <div className="flex flex-col md:flex-row gap-4 justify-between items-center mb-6">
            <h1 className="text-2xl font-black text-slate-900">Search & Filter Dishes</h1>
            <input 
              type="text" 
              placeholder="Search for pizza, biryani, burgers..." 
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              className="w-full md:w-80 px-4 py-2.5 border rounded-xl text-sm focus:outline-emerald-500"
            />
          </div>

          <div className="flex gap-2 overflow-x-auto no-scrollbar mb-6">
            {['All', 'Pizza', 'Burger', 'Biryani', 'Chinese', 'South Indian', 'Desserts', 'Beverages'].map(cat => (
              <button 
                key={cat} 
                onClick={() => setSelectedCategory(cat)}
                className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700'}`}
              >
                {cat}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {filtered.map(p => (
              <FoodCard key={p.id} product={p} />
            ))}
          </div>
        </div>
      );
    };

    const CartPage = () => {
      const { cart, updateQty, subtotal, deliveryFee, tax, discount, grandTotal, appliedCoupon, setAppliedCoupon, setCurrentRoute, setLastOrderId, clearCart } = useApp();
      const [couponInput, setCouponInput] = useState('');

      const handleCheckout = () => {
        const newOrderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        setLastOrderId(newOrderId);
        clearCart();
        setCurrentRoute('success');
      };

      if (cart.length === 0) {
        return (
          <div className="max-w-md mx-auto text-center py-20 px-4">
            <div className="text-5xl mb-4">🛒</div>
            <h2 className="text-2xl font-bold text-slate-900 mb-2">Your Cart is Empty</h2>
            <p className="text-xs text-slate-500 mb-6">Add delicious items from menu to place an order.</p>
            <button onClick={() => setCurrentRoute('home')} className="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">
              Explore Menu
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-black text-slate-900 mb-6">Your Cart</h1>
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 space-y-4">
              {cart.map(({ product, qty }) => (
                <div key={product.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <img src={product.image} className="w-16 h-16 rounded-xl object-cover" />
                    <div>
                      <h3 className="font-bold text-slate-900 text-sm">{product.name}</h3>
                      <p className="text-xs text-slate-500">₹{product.price} each</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="flex items-center gap-2 bg-slate-100 rounded-lg px-2 py-1 text-xs font-bold">
                      <button onClick={() => updateQty(product.id, -1)}>-</button>
                      <span>{qty}</span>
                      <button onClick={() => updateQty(product.id, 1)}>+</button>
                    </div>
                    <span className="font-bold text-slate-900 text-sm">₹{product.price * qty}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-100 space-y-4 h-fit">
              <h3 className="font-bold text-slate-900 border-b pb-3">Bill Details</h3>
              
              <div className="flex gap-2">
                <input 
                  type="text" 
                  placeholder="Coupon Code" 
                  value={couponInput}
                  onChange={e => setCouponInput(e.target.value)}
                  className="flex-1 px-3 py-1.5 border rounded-xl text-xs"
                />
                <button 
                  onClick={() => setAppliedCoupon(couponInput.toUpperCase())}
                  className="px-3 py-1.5 bg-slate-900 text-white text-xs font-bold rounded-xl"
                >
                  Apply
                </button>
              </div>
              <p className="text-[10px] text-slate-400">Try: WELCOME50, FOOD20, SAVE100</p>

              <div className="space-y-2 text-xs text-slate-600 pt-2 border-t">
                <div className="flex justify-between"><span>Subtotal</span><span>₹{subtotal}</span></div>
                <div className="flex justify-between"><span>Delivery Fee</span><span>₹{deliveryFee}</span></div>
                <div className="flex justify-between"><span>Tax (5%)</span><span>₹{tax}</span></div>
                {discount > 0 && <div className="flex justify-between text-emerald-600 font-bold"><span>Discount</span><span>-₹{discount}</span></div>}
                <div className="flex justify-between font-black text-sm text-slate-900 pt-2 border-t"><span>To Pay</span><span>₹{grandTotal}</span></div>
              </div>

              <button 
                onClick={handleCheckout} 
                className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl transition"
              >
                Place Order (₹{grandTotal})
              </button>
            </div>
          </div>
        </div>
      );
    };

    const OrderSuccessPage = () => {
      const { lastOrderId, setCurrentRoute } = useApp();
      return (
        <div className="max-w-md mx-auto text-center py-20 px-4">
          <div className="text-6xl mb-4">🎉</div>
          <h1 className="text-2xl font-black text-slate-900 mb-2">Order Placed Successfully!</h1>
          <p className="text-xs text-slate-500 mb-6">Your order ID is <span className="font-bold text-slate-800">#{lastOrderId}</span>. The restaurant is preparing your meal.</p>
          <button onClick={() => setCurrentRoute('home')} className="px-6 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">
            Back to Home
          </button>
        </div>
      );
    };

    const AdminDashboard = () => {
      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-black text-slate-900 mb-6">System Admin Panel</h1>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500 font-semibold">Total Revenue</p>
              <p className="text-2xl font-black text-slate-900">₹1,48,200</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500 font-semibold">Total Orders</p>
              <p className="text-2xl font-black text-slate-900">1,240</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500 font-semibold">Active Restaurants</p>
              <p className="text-2xl font-black text-slate-900">10</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500 font-semibold">Total Users</p>
              <p className="text-2xl font-black text-slate-900">4,890</p>
            </div>
          </div>
        </div>
      );
    };

    const RestaurantDashboard = () => {
      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-black text-slate-900 mb-6">Restaurant Owner Panel (Pizza Hub)</h1>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500">Today's Sales</p>
              <p className="text-xl font-bold">₹12,450</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500">Active Orders</p>
              <p className="text-xl font-bold">4 Orders</p>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-100">
              <p className="text-xs text-slate-500">Menu Items</p>
              <p className="text-xl font-bold">24 Items</p>
            </div>
          </div>
        </div>
      );
    };

    const ProductModal = () => {
      const { activeProductModal, setActiveProductModal, addToCart } = useApp();
      if (!activeProductModal) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl relative">
            <button onClick={() => setActiveProductModal(null)} className="absolute top-3 right-3 bg-white/80 p-2 rounded-full font-bold">✕</button>
            <img src={activeProductModal.image} className="w-full h-48 object-cover" />
            <div className="p-6 space-y-3">
              <div className="flex justify-between items-start">
                <h2 className="text-xl font-extrabold text-slate-900">{activeProductModal.name}</h2>
                <span className="text-emerald-600 font-black">₹{activeProductModal.price}</span>
              </div>
              <p className="text-xs text-slate-500">{activeProductModal.desc}</p>
              <div className="pt-2">
                <p className="text-[11px] font-bold text-slate-700 mb-1">Ingredients:</p>
                <div className="flex flex-wrap gap-1">
                  {activeProductModal.ingredients.map((ing, i) => (
                    <span key={i} className="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full">{ing}</span>
                  ))}
                </div>
              </div>
              <button 
                onClick={() => { addToCart(activeProductModal); setActiveProductModal(null); }}
                className="w-full py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl mt-4"
              >
                Add To Cart
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Main App Routing Container
    const MainApp = () => {
      const { currentRoute } = useApp();

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="min-h-screen bg-slate-50 font-sans">
          <Header />
          <main>
            {currentRoute === 'home' && <HomePage />}
            {currentRoute === 'search' && <SearchPage />}
            {currentRoute === 'cart' && <CartPage />}
            {currentRoute === 'success' && <OrderSuccessPage />}
            {currentRoute === 'admin' && <AdminDashboard />}
            {currentRoute === 'restaurantAdmin' && <RestaurantDashboard />}
          </main>
          <ProductModal />
        </div>
      );
    };

    const App = () => (
      <AppProvider>
        <MainApp />
      </AppProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
