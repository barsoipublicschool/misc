<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodExpress - Order Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // GOOGLE SHEET WEB APP URL PASTE HERE
    const GOOGLE_SHEET_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    const DEFAULT_PRODUCTS = [
      { id: 'p1', name: 'Margherita Pizza', price: 249, category: 'Pizza', isVeg: true, image: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=600&q=80', desc: 'Classic mozzarella cheese pizza.' },
      { id: 'p2', name: 'Chicken Biryani', price: 299, category: 'Biryani', isVeg: false, image: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600&q=80', desc: 'Aromatic basmati rice cooked with chicken.' },
      { id: 'p3', name: 'Classic Veg Burger', price: 129, category: 'Burger', isVeg: true, image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=600&q=80', desc: 'Crispy veggie patty with mayonnaise.' }
    ];

    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [products, setProducts] = useState(DEFAULT_PRODUCTS);
      const [cart, setCart] = useState([]);
      const [currentRoute, setCurrentRoute] = useState('home');
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [lastOrderDetails, setLastOrderDetails] = useState(null);

      // Load products from Google Sheet if URL exists
      useEffect(() => {
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "https://script.google.com/macros/s/AKfycbzUxrLKQ5OO0V-rzw47o8pB541RsSEDpeDY_LipBTBx0NPwU4NfWts7MZNAF_2S54M/exec") {
          fetch(GOOGLE_SHEET_URL)
            .then(res => res.json())
            .then(data => { if(data && data.length) setProducts(data); })
            .catch(err => console.log("Using default products", err));
        }
      }, []);

      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(i => i.product.id === product.id);
          if (exists) return prev.map(i => i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { product, qty: 1 }];
        });
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(i => {
          if (i.product.id === id) {
            const newQty = i.qty + delta;
            return newQty > 0 ? { ...i, qty: newQty } : null;
          }
          return i;
        }).filter(Boolean));
      };

      const grandTotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0) + (cart.length > 0 ? 40 : 0);

      return (
        <AppContext.Provider value={{
          products, cart, addToCart, updateQty, currentRoute, setCurrentRoute,
          isCheckoutOpen, setIsCheckoutOpen, grandTotal, setCart, lastOrderDetails, setLastOrderDetails
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // Header Component
    const Header = () => {
      const { cart, setCurrentRoute } = useApp();
      const count = cart.reduce((s, i) => s + i.qty, 0);
      return (
        <header className="sticky top-0 bg-white border-b border-slate-200 z-40 p-4 flex justify-between items-center max-w-7xl mx-auto">
          <h1 onClick={() => setCurrentRoute('home')} className="font-extrabold text-xl text-emerald-600 cursor-pointer">FoodExpress</h1>
          <button onClick={() => setCurrentRoute('cart')} className="relative bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl text-xs font-bold">
            🛒 Cart ({count})
          </button>
        </header>
      );
    };

    // Checkout Modal (Address & Payment Form)
    const CheckoutModal = () => {
      const { isCheckoutOpen, setIsCheckoutOpen, cart, grandTotal, setCart, setCurrentRoute, setLastOrderDetails } = useApp();
      const [formData, setFormData] = useState({ name: '', mobile: '', address: '', paymentMethod: 'COD' });

      if (!isCheckoutOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        const orderPayload = {
          action: "ADD_ORDER",
          orderId,
          ...formData,
          items: cart.map(c => `${c.product.name} (x${c.qty})`),
          totalAmount: grandTotal
        };

        // Sync to Google Sheet
        if (GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            body: JSON.stringify(orderPayload)
          });
        }

        setLastOrderDetails(orderPayload);
        setCart([]);
        setIsCheckoutOpen(false);
        setCurrentRoute('success');
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-slate-900">Delivery Details</h3>
              <button onClick={() => setIsCheckoutOpen(false)}>✕</button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="font-bold text-slate-700">Full Name</label>
                <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" placeholder="Riyaz Ahmad" />
              </div>
              <div>
                <label className="font-bold text-slate-700">Mobile Number</label>
                <input required type="tel" value={formData.mobile} onChange={e => setFormData({...formData, mobile: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" placeholder="9876543210" />
              </div>
              <div>
                <label className="font-bold text-slate-700">Complete Address</label>
                <textarea required value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1" rows="2" placeholder="House No, Landmark, City"></textarea>
              </div>
              <div>
                <label className="font-bold text-slate-700">Payment Method</label>
                <select value={formData.paymentMethod} onChange={e => setFormData({...formData, paymentMethod: e.target.value})} className="w-full border p-2.5 rounded-xl mt-1 font-bold">
                  <option value="COD">Cash on Delivery (COD)</option>
                  <option value="UPI">UPI / Online Payment</option>
                </select>
              </div>
              <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl mt-2">
                Confirm Order (₹{grandTotal})
              </button>
            </form>
          </div>
        </div>
      );
    };

    // Home Page
    const HomePage = () => {
      const { products, addToCart } = useApp();
      return (
        <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          {products.map(p => (
            <div key={p.id} className="bg-white p-3 border rounded-2xl space-y-2">
              <img src={p.image} className="w-full h-40 object-cover rounded-xl" />
              <h3 className="font-bold text-sm">{p.name}</h3>
              <p className="text-xs text-slate-500">{p.desc}</p>
              <div className="flex justify-between items-center pt-2">
                <span className="font-extrabold text-sm">₹{p.price}</span>
                <button onClick={() => addToCart(p)} className="bg-emerald-600 text-white px-3 py-1.5 text-xs font-bold rounded-xl">+ ADD</button>
              </div>
            </div>
          ))}
        </div>
      );
    };

    // Cart Page
    const CartPage = () => {
      const { cart, updateQty, grandTotal, setIsCheckoutOpen } = useApp();
      if (cart.length === 0) return <div className="p-12 text-center text-xs font-bold text-slate-500">Cart is empty</div>;
      return (
        <div className="max-w-xl mx-auto p-4 space-y-4">
          <h2 className="font-bold text-lg">Your Cart</h2>
          {cart.map(({ product, qty }) => (
            <div key={product.id} className="bg-white p-3 border rounded-xl flex justify-between items-center text-xs">
              <div>
                <p className="font-bold">{product.name}</p>
                <p className="text-slate-500">₹{product.price} x {qty}</p>
              </div>
              <div className="flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                <button onClick={() => updateQty(product.id, -1)} className="px-2 font-bold">-</button>
                <span>{qty}</span>
                <button onClick={() => updateQty(product.id, 1)} className="px-2 font-bold">+</button>
              </div>
            </div>
          ))}
          <button onClick={() => setIsCheckoutOpen(true)} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs">
            Proceed to Checkout (₹{grandTotal})
          </button>
        </div>
      );
    };

    // Success Page
    const SuccessPage = () => {
      const { lastOrderDetails, setCurrentRoute } = useApp();
      return (
        <div className="max-w-md mx-auto p-8 text-center space-y-4">
          <div className="text-5xl">🎉</div>
          <h2 className="font-bold text-xl text-slate-900">Order Placed Successfully!</h2>
          {lastOrderDetails && (
            <div className="bg-slate-100 p-4 rounded-xl text-left text-xs space-y-1">
              <p><strong>Order ID:</strong> {lastOrderDetails.orderId}</p>
              <p><strong>Name:</strong> {lastOrderDetails.name}</p>
              <p><strong>Mobile:</strong> {lastOrderDetails.mobile}</p>
              <p><strong>Address:</strong> {lastOrderDetails.address}</p>
              <p><strong>Payment:</strong> {lastOrderDetails.paymentMethod}</p>
              <p><strong>Total Amount:</strong> ₹{lastOrderDetails.totalAmount}</p>
            </div>
          )}
          <button onClick={() => setCurrentRoute('home')} className="px-6 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">Back to Home</button>
        </div>
      );
    };

    const App = () => {
      const { currentRoute } = useApp();
      return (
        <div>
          <Header />
          {currentRoute === 'home' && <HomePage />}
          {currentRoute === 'cart' && <CartPage />}
          {currentRoute === 'success' && <SuccessPage />}
          <CheckoutModal />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App /></AppProvider>);
  </script>
</body>
</html>
