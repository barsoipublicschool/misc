<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodExpress - Order Food Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Paste your Web App URL here
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxDnnSaiaeemj_Xx1xRRJzmkXVG-35J6yXwLzGAb284qtSJy_UusVjtDKcaG59M0yfH/exec";

    const DEFAULT_PRODUCTS = [
      { id: 'p1', name: 'Margherita Pizza', price: 249, category: 'Pizza', isVeg: true, image: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=600&q=80', desc: 'Classic mozzarella cheese pizza.' },
      { id: 'p2', name: 'Special Chicken Biryani', price: 299, category: 'Biryani', isVeg: false, image: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600&q=80', desc: 'Aromatic basmati rice cooked with chicken.' },
      { id: 'p3', name: 'Cheese Burst Burger', price: 149, category: 'Burger', isVeg: true, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80', desc: 'Loaded patty with melted cheese.' }
    ];

    const App = () => {
      const [currentView, setCurrentView] = useState('home'); // 'home', 'cart', 'tracking'
      const [products, setProducts] = useState(DEFAULT_PRODUCTS);
      const [cart, setCart] = useState([]);
      const [activeOrder, setActiveOrder] = useState(null);
      const [isCheckout, setIsCheckout] = useState(false);
      const [form, setForm] = useState({ name: '', mobile: '', address: '', paymentMethod: 'COD' });

      const addToCart = (product) => {
        setCart(prev => {
          const ex = prev.find(i => i.product.id === product.id);
          if (ex) return prev.map(i => i.product.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { product, qty: 1 }];
        });
      };

      const updateQty = (id, d) => {
        setCart(prev => prev.map(i => i.product.id === id ? { ...i, qty: i.qty + d } : i).filter(i => i.qty > 0));
      };

      const totalAmount = cart.reduce((s, i) => s + (i.product.price * i.qty), 0) + (cart.length > 0 ? 30 : 0);

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        const payload = {
          action: "ADD_ORDER",
          orderId,
          ...form,
          items: cart.map(c => `${c.product.name} (x${c.qty})`),
          totalAmount
        };

        // Send to Google Sheet
        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
          fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        setActiveOrder({ ...payload, statusStep: 1 }); // Step 1: Order Placed
        setCart([]);
        setIsCheckout(false);
        setCurrentView('tracking');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Pure Customer Header */}
          <header className="bg-white border-b sticky top-0 z-40 p-4">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <h1 onClick={() => setCurrentView('home')} className="text-xl font-extrabold text-emerald-600 cursor-pointer">FoodExpress</h1>
              <div className="flex gap-4 items-center">
                {activeOrder && (
                  <button onClick={() => setCurrentView('tracking')} className="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-xl">📍 Track Order</button>
                )}
                <button onClick={() => setCurrentView('cart')} className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">
                  🛒 Cart ({cart.reduce((s, i) => s + i.qty, 0)})
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-6xl mx-auto p-4 w-full">
            {/* HOME VIEW */}
            {currentView === 'home' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 py-4">
                {products.map(p => (
                  <div key={p.id} className="bg-white border rounded-2xl p-4 space-y-3">
                    <img src={p.image} className="w-full h-40 object-cover rounded-xl" />
                    <h3 className="font-bold text-sm text-slate-900">{p.name}</h3>
                    <p className="text-xs text-slate-500">{p.desc}</p>
                    <div className="flex justify-between items-center pt-2">
                      <span className="font-extrabold text-sm">₹{p.price}</span>
                      <button onClick={() => addToCart(p)} className="bg-emerald-600 text-white px-3 py-1.5 text-xs font-bold rounded-xl">+ Add</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* CART VIEW */}
            {currentView === 'cart' && (
              <div className="max-w-lg mx-auto py-6 space-y-4">
                <h2 className="font-extrabold text-lg">Your Cart</h2>
                {cart.length === 0 ? <p className="text-xs text-slate-500">Cart is empty.</p> : (
                  <>
                    <div className="bg-white border rounded-2xl divide-y">
                      {cart.map(({ product, qty }) => (
                        <div key={product.id} className="p-4 flex justify-between items-center text-xs">
                          <div>
                            <p className="font-bold">{product.name}</p>
                            <p className="text-slate-500">₹{product.price} x {qty}</p>
                          </div>
                          <div className="flex gap-2 items-center bg-slate-100 px-2 py-1 rounded-lg font-bold">
                            <button onClick={() => updateQty(product.id, -1)}>-</button>
                            <span>{qty}</span>
                            <button onClick={() => updateQty(product.id, 1)}>+</button>
                          </div>
                        </div>
                      ))}
                    </div>
                    <button onClick={() => setIsCheckout(true)} className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs">Proceed to Checkout (₹{totalAmount})</button>
                  </>
                )}
              </div>
            )}

            {/* LIVE TRACKING VIEW */}
            {currentView === 'tracking' && activeOrder && (
              <div className="max-w-md mx-auto py-8 bg-white border rounded-2xl p-6 space-y-6">
                <div className="text-center">
                  <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">Order ID: {activeOrder.orderId}</span>
                  <h3 className="font-extrabold text-lg text-slate-900 mt-2">Live Order Status</h3>
                </div>

                {/* Progress Tracker Stepper */}
                <div className="space-y-4 text-xs font-bold">
                  {[
                    { step: 1, label: 'Order Placed', desc: 'We have received your order' },
                    { step: 2, label: 'Preparing', desc: 'Restaurant is preparing your food' },
                    { step: 3, label: 'On the Way', desc: 'Delivery partner is on the way' },
                    { step: 4, label: 'Delivered', desc: 'Food delivered successfully' },
                  ].map(s => (
                    <div key={s.step} className="flex gap-4 items-center">
                      <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs text-white ${activeOrder.statusStep >= s.step ? 'bg-emerald-600' : 'bg-slate-200 text-slate-400'}`}>
                        {s.step}
                      </div>
                      <div>
                        <p className={activeOrder.statusStep >= s.step ? 'text-slate-900 font-bold' : 'text-slate-400'}>{s.label}</p>
                        <p className="text-[10px] text-slate-400 font-normal">{s.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="border-t pt-4 text-xs text-slate-600 space-y-1">
                  <p><strong>Deliver To:</strong> {activeOrder.name} ({activeOrder.mobile})</p>
                  <p><strong>Address:</strong> {activeOrder.address}</p>
                  <p><strong>Payment:</strong> {activeOrder.paymentMethod}</p>
                </div>
              </div>
            )}
          </main>

          {/* Checkout Modal */}
          {isCheckout && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm">Delivery & Address Details</h3>
                  <button onClick={() => setIsCheckout(false)}>✕</button>
                </div>
                <form onSubmit={handlePlaceOrder} className="space-y-3 text-xs">
                  <input required placeholder="Full Name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full border p-2.5 rounded-xl" />
                  <input required placeholder="Mobile Number" value={form.mobile} onChange={e => setForm({...form, mobile: e.target.value})} className="w-full border p-2.5 rounded-xl" />
                  <textarea required placeholder="Delivery Address" value={form.address} onChange={e => setForm({...form, address: e.target.value})} className="w-full border p-2.5 rounded-xl" rows="2"></textarea>
                  <select value={form.paymentMethod} onChange={e => setForm({...form, paymentMethod: e.target.value})} className="w-full border p-2.5 rounded-xl font-bold">
                    <option value="COD">Cash on Delivery (COD)</option>
                    <option value="UPI">Online UPI / Payment</option>
                  </select>
                  <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Confirm & Place Order</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
