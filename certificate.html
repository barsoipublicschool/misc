<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Certificate Generator - Barsoi Public School</title>
  <style>
    * { box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }
    body { background-color: #eef2f5; margin: 0; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; }

    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; font-family: 'Segoe UI', sans-serif; }
    .card h2 { color: #004085; margin-top: 0; font-size: 18px; font-family: 'Segoe UI', sans-serif; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #333; font-family: 'Segoe UI', sans-serif; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: 'Segoe UI', sans-serif; }

    .btn { padding: 10px 18px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; font-family: 'Segoe UI', sans-serif; }
    .btn-primary { background: #004085; color: white; }
    .btn:hover { opacity: 0.9; }

    /* Certificate Box Layout */
    .cert-preview-area {
      background: #fffdf9;
      width: 100%;
      aspect-ratio: 1.414 / 1;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 4px;
      position: relative;
      padding: 15px;
      margin: 0 auto;
    }

    /* Royal Multi-Layered Border */
    .cert-outer-border {
      border: 4px solid #002b5b;
      padding: 5px;
      height: 100%;
      position: relative;
      background: #fffdf9;
    }

    .cert-gold-border {
      border: 2px solid #d4af37;
      padding: 3px;
      height: 100%;
    }

    .cert-inner-border {
      border: 2px solid #002b5b;
      padding: 25px 30px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      position: relative;
    }

    /* Decorative Corner Elements */
    .corner-decoration {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid #d4af37;
    }
    .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    /* Header & Logos Layout */
    .header-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .school-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .header-text {
      flex-grow: 1;
      text-align: center;
      padding: 0 15px;
    }

    .school-name { font-size: 32px; font-weight: bold; color: #002b5b; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
    .school-sub { font-size: 13px; letter-spacing: 1px; color: #555; font-weight: 700; margin-top: 5px; font-family: 'Segoe UI', sans-serif; }
    
    .cert-title { font-size: 26px; font-weight: bold; color: #8b0000; text-transform: uppercase; margin: 15px 0 10px 0; letter-spacing: 1.5px; display: inline-block; border-bottom: 2px double #8b0000; padding-bottom: 2px; }

    .cert-body { font-size: 19px; line-height: 1.9; color: #222; margin: 25px 20px; text-align: center; }
    .highlight { font-weight: bold; font-size: 20px; text-decoration: underline; color: #000; padding: 0 4px; }

    .cert-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; padding: 0 30px; }
    .sig-box { text-align: center; width: 180px; font-size: 14px; font-weight: bold; }
    .sig-line { border-top: 1px solid #333; margin-top: 50px; padding-top: 4px; }

    /* Exact 1:1 Print Layout Fix for PDF */
    @page {
      size: A4 landscape;
      margin: 0;
    }
    @media print {
      .no-print { display: none !important; }
      html, body {
        background: white;
        margin: 0;
        padding: 0;
        width: 297mm;
        height: 210mm;
      }
      .container {
        max-width: 100%;
        width: 297mm;
        height: 210mm;
        margin: 0;
        padding: 0;
      }
      .cert-preview-area {
        box-shadow: none;
        width: 297mm;
        height: 210mm;
        padding: 8mm;
        border-radius: 0;
        aspect-ratio: auto;
      }
      .cert-inner-border {
        padding: 20px 30px;
      }
      .school-logo {
        width: 120px;
        height: 120px;
      }
      .school-name { font-size: 32px; }
      .cert-title { font-size: 26px; }
      .cert-body { font-size: 19px; margin: 20px 15px; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Controls Panel -->
  <div class="card no-print">
    <h2>🎓 Auto Certificate Generator</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Certificate Type</label>
        <select id="certType" onchange="updateCertificate()">
          <option value="Merit">Academic Merit Certificate</option>
          <option value="Sports">Sports Achievement Certificate</option>
          <option value="Bonafide">Bonafide Student Certificate</option>
        </select>
      </div>
      <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="stuName" value="Rohan Kumar" oninput="updateCertificate()">
      </div>
      <div class="form-group">
        <label>Father's Name</label>
        <input type="text" id="fatherName" value="Shri Suresh Kumar" oninput="updateCertificate()">
      </div>
      <div class="form-group">
        <label>Class & Section</label>
        <input type="text" id="stuClass" value="Class VI - A" oninput="updateCertificate()">
      </div>
      <div class="form-group">
        <label>Roll / Reg No.</label>
        <input type="text" id="stuRoll" value="BPS/2026/042" oninput="updateCertificate()">
      </div>
      <div class="form-group">
        <label>Event / Achievement Details</label>
        <input type="text" id="eventText" value="1st Rank in Annual Examination 2026" oninput="updateCertificate()">
      </div>
    </div>
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Download PDF</button>
  </div>

  <!-- Printable Certificate Area -->
  <div class="cert-preview-area">
    <div class="cert-outer-border">
      <div class="cert-gold-border">
        <div class="cert-inner-border">
          
          <div class="corner-decoration top-left"></div>
          <div class="corner-decoration top-right"></div>
          <div class="corner-decoration bottom-left"></div>
          <div class="corner-decoration bottom-right"></div>

          <div>
            <div class="header-layout">
              <img src="https://lh3.googleusercontent.com/d/14JG21SYtSpghaukrY6_QTB-LCYPZ8gkE" class="school-logo" alt="Logo Left">
              <div class="header-text">
                <div class="school-name">BARSOI PUBLIC SCHOOL</div>
                <div class="school-sub">BARSOI, KATIHAR, BIHAR | AFFILIATED & RECOGNIZED</div>
              </div>
              <img src="https://lh3.googleusercontent.com/d/14JG21SYtSpghaukrY6_QTB-LCYPZ8gkE" class="school-logo" alt="Logo Right">
            </div>
            
            <div id="dispCertTitle" class="cert-title">CERTIFICATE OF MERIT</div>
          </div>

          <div class="cert-body" id="dispCertBody">
            <!-- Dynamic Content -->
          </div>

          <div class="cert-footer">
            <div class="sig-box">
              <div>Date: <span id="dispDate">30/08/2026</span></div>
            </div>
            <div class="sig-box">
              <div class="sig-line">Class Teacher</div>
            </div>
            <div class="sig-box">
              <div class="sig-line">Principal / Director</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

<script>
  function updateCertificate() {
    const type = document.getElementById('certType').value;
    const name = document.getElementById('stuName').value || '__________';
    const father = document.getElementById('fatherName').value || '__________';
    const cls = document.getElementById('stuClass').value || '__________';
    const roll = document.getElementById('stuRoll').value || '__________';
    const eventText = document.getElementById('eventText').value || '__________';

    const titleElem = document.getElementById('dispCertTitle');
    const bodyElem = document.getElementById('dispCertBody');

    document.getElementById('dispDate').innerText = new Date().toLocaleDateString('en-GB');

    if (type === 'Merit') {
      titleElem.innerText = 'CERTIFICATE OF MERIT';
      bodyElem.innerHTML = `This is to proudly certify that <span class="highlight">${name}</span>, Son/Daughter of <span class="highlight">${father}</span>, Roll No. <span class="highlight">${roll}</span>, student of <span class="highlight">${cls}</span>, has successfully secured <span class="highlight">${eventText}</span>. We wish them a bright future.`;
    } else if (type === 'Sports') {
      titleElem.innerText = 'SPORTS ACHIEVEMENT CERTIFICATE';
      bodyElem.innerHTML = `This certificate is awarded to <span class="highlight">${name}</span>, Class <span class="highlight">${cls}</span>, for outstanding performance and securing position in <span class="highlight">${eventText}</span> during the Annual School Sports Meet.`;
    } else if (type === 'Bonafide') {
      titleElem.innerText = 'BONAFIDE CERTIFICATE';
      bodyElem.innerHTML = `This is to certify that <span class="highlight">${name}</span>, Son/Daughter of <span class="highlight">${father}</span>, is a bonafide student of <span class="highlight">${cls}</span> (Roll No: <span class="highlight">${roll}</span>) of Barsoi Public School for the academic session 2026-2027. His/Her conduct in the school has been good.`;
    }
  }

  window.onload = updateCertificate;
</script>

</body>
</html>
