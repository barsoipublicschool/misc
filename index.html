<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Paper Generator - Barsoi Public School</title>

  <style>
    * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
    body { background: #eef2f5; margin: 0; padding: 10px; color: #111; }

    .control-panel {
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .control-panel h2 { margin-top: 0; color: #004085; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 3px; }
    .form-group input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .full-width { grid-column: span 2; }

    .section-counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      margin-bottom: 12px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: #004085; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn:hover { opacity: 0.9; }

    #fileInput { display: none; }
    #imagePreview { max-height: 80px; display: none; margin-top: 8px; border-radius: 4px; border: 1px solid #ddd; }

    /* Paper Styling */
    .paper-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: white;
      padding: 25px 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      overflow: hidden;
    }

    .school-title { text-align: center; font-size: 20px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
    .exam-title { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

    .meta-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 4px; width: 100%; }
    .instruction { font-style: italic; font-weight: bold; font-size: 12px; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 2px 0; margin: 6px 0 12px 0; text-align: center; width: 100%; }

    .section-title { font-weight: bold; font-size: 12px; margin-top: 10px; margin-bottom: 6px; text-transform: uppercase; background: #f0f0f0; padding: 3px 6px; width: 100%; }
    .question-item { margin-bottom: 8px; font-size: 12px; line-height: 1.35; width: 100%; word-wrap: break-word; }
    .mcq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-left: 15px; margin-top: 3px; font-size: 11.5px; width: 95%; }
    
    .loading-spinner { display: none; color: #004085; font-weight: bold; margin-top: 8px; font-size: 13px; }

    @media print {
      body { padding: 0; background: white; }
      .control-panel { display: none !important; }
      .paper-container { box-shadow: none; margin: 0; width: 100%; max-width: 100%; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>🎯 Question Paper Generator Settings</h2>
    
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Exam Name (Center Title)</label>
        <input type="text" id="inputExam" value="ANNUAL EXAMINATION - 2026">
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" id="inputClass" value="Class - VIII">
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="inputSubject" value="English Grammar">
      </div>
      <div class="form-group">
        <label>Full Marks (FM)</label>
        <input type="text" id="inputFM" value="100">
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="text" id="inputTime" value="2 hrs.">
      </div>
      <div class="form-group full-width">
        <label>Topic Name / Instructions</label>
        <input type="text" id="inputPrompt" value="Parts of Speech (Noun, Pronoun, Verb, Adjective, Adverb)">
      </div>
    </div>

    <label style="font-size: 12px; font-weight: bold; font-family: 'Segoe UI';">Question Quantities (Dynamic):</label>
    <div class="section-counts">
      <div class="form-group">
        <label>MCQs</label>
        <input type="number" id="countMcq" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Fill Blanks</label>
        <input type="number" id="countFill" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Short Qs</label>
        <input type="number" id="countShort" value="7" min="0">
      </div>
      <div class="form-group">
        <label>Long Qs</label>
        <input type="number" id="countLong" value="5" min="0">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📷 / 🖼️ Upload Handwritten / Image Question</button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
      
      <button class="btn btn-primary" onclick="generateQuestionPaper()">⚡ Generate Paper with AI</button>
      <button class="btn btn-success" onclick="printOrSavePDF()">🖨️ Print / Save as PDF</button>
    </div>

    <img id="imagePreview" alt="Uploaded Handwritten Content Preview">
    <div id="loading" class="loading-spinner">⏳ AI Processing Image / Generating Question Paper... Please wait</div>
  </div>

  <div class="paper-container" id="paperArea">
    <div class="school-title">BARSOI PUBLIC SCHOOL</div>
    <div class="exam-title" id="dispExam">ANNUAL EXAMINATION - 2026</div>

    <div class="meta-row">
      <span>FM - <span id="dispFM">100</span></span>
      <span>Time - <span id="dispTime">2 hrs.</span></span>
    </div>

    <div class="meta-row">
      <span><span id="dispClass">Class - VIII</span></span>
      <span>Subject - <span id="dispSubject">English Grammar</span></span>
    </div>

    <div class="instruction">All questions are compulsory.</div>

    <div id="questionsOutput"></div>
  </div>

<script>
  const WORKER_URL = "https://barsoi-ai-proxy.barsoipublicschool26.workers.dev/";
  let base64Image = null;
  let imageMimeType = "image/jpeg";

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
      imageMimeType = file.type || "image/jpeg";
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result.split(',')[1];
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  function syncHeaderInfo() {
    document.getElementById('dispFM').innerText = document.getElementById('inputFM').value;
    document.getElementById('dispTime').innerText = document.getElementById('inputTime').value;
    document.getElementById('dispClass').innerText = document.getElementById('inputClass').value;
    document.getElementById('dispExam').innerText = document.getElementById('inputExam').value;
    document.getElementById('dispSubject').innerText = document.getElementById('inputSubject').value;
  }

  async function generateQuestionPaper() {
    syncHeaderInfo();

    const subject = document.getElementById('inputSubject').value;
    const className = document.getElementById('inputClass').value;
    const topicPrompt = document.getElementById('inputPrompt').value;
    
    const numMcq = parseInt(document.getElementById('countMcq').value) || 0;
    const numFill = parseInt(document.getElementById('countFill').value) || 0;
    const numShort = parseInt(document.getElementById('countShort').value) || 0;
    const numLong = parseInt(document.getElementById('countLong').value) || 0;

    const loading = document.getElementById('loading');
    loading.style.display = 'block';

    const systemPrompt = `You are a school teacher creating an official exam paper.
Return ONLY valid raw HTML code without markdown styling or backticks (\`\`\`html).
If an image is provided, extract handwritten or printed questions from it and align them into requested sections.
If no image, generate fresh questions on Subject: "${subject}" and Topic: "${topicPrompt}".

Ensure:
- Output 4 sections:
  <div class="section-title">SECTION A: MULTIPLE CHOICE QUESTIONS</div> (${numMcq} MCQs)
  Format: <div class="question-item">Q1. Question text<div class="mcq-options"><div>(a) Opt1</div><div>(b) Opt2</div><div>(c) Opt3</div><div>(d) Opt4</div></div></div>
  <div class="section-title">SECTION B: FILL IN THE BLANKS</div> (${numFill} Questions)
  <div class="section-title">SECTION C: SHORT ANSWER QUESTIONS</div> (${numShort} Questions)
  <div class="section-title">SECTION D: LONG ANSWER QUESTIONS</div> (${numLong} Questions)
- Sequence question numbering Q1, Q2, Q3 continuously.
- Do not repeat questions.`;

    const userPrompt = `Class: ${className}, Subject: ${subject}, Topic: ${topicPrompt}. Counts: MCQ=${numMcq}, Fill=${numFill}, Short=${numShort}, Long=${numLong}`;

    try {
      const parts = [{ text: userPrompt }];
      if (base64Image) {
        parts.push({
          inline_data: {
            mime_type: imageMimeType,
            data: base64Image
          }
        });
      }

      const payload = {
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ parts: parts }]
      };

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("Worker Error");

      const data = await response.json();
      let textOutput = "";

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        textOutput = data.candidates[0].content.parts[0].text;
      }

      if (textOutput && textOutput.trim().length > 50) {
        let formattedHTML = textOutput.replace(/```html/g, '').replace(/```/g, '').trim();
        document.getElementById('questionsOutput').innerHTML = formattedHTML;
      } else {
        generateSmartEnglishFallback(topicPrompt, numMcq, numFill, numShort, numLong);
      }
    } catch (err) {
      console.warn("AI generation failed or timed out. Rendering fallback paper.", err);
      generateSmartEnglishFallback(topicPrompt, numMcq, numFill, numShort, numLong);
    } finally {
      loading.style.display = 'none';
    }
  }

  function generateSmartEnglishFallback(topic, mcqCount, fillCount, shortCount, longCount) {
    let qNum = 1;
    let html = "";

    const mcqQuestions = [
      { q: "Identify the Noun in the sentence: 'Honesty is the best policy.'", opts: ["(a) Honesty", "(b) Best", "(c) Is", "(d) The"] },
      { q: "Which part of speech is the underlined word? 'She runs <ins>fast</ins>.'", opts: ["(a) Adjective", "(b) Adverb", "(c) Verb", "(d) Noun"] },
      { q: "Choose the correct Pronoun: 'Rohan lost _____ book in the playground.'", opts: ["(a) her", "(b) his", "(c) their", "(d) its"] },
      { q: "Identify the Verb: 'The birds are flying in the sky.'", opts: ["(a) Birds", "(b) Sky", "(c) Flying", "(d) In"] },
      { q: "Which word is a Proper Noun?", opts: ["(a) City", "(b) Patna", "(c) Teacher", "(d) River"] },
      { q: "Find the Adjective: 'He bought a beautiful car yesterday.'", opts: ["(a) Bought", "(b) Car", "(c) Beautiful", "(d) Yesterday"] }
    ];

    const fillQuestions = [
      "A ____________ is a word used to describe or modify a noun.",
      "The word 'and', 'but', and 'because' belong to the ____________ part of speech.",
      "In the sentence 'Hurrah! We won the match', the word 'Hurrah' is an ____________.",
      "Abstract nouns express ideas, feelings, or ____________.",
      "Prepositions show the relationship between a noun and another word in a ____________."
    ];

    const shortQuestions = [
      "Define 'Noun' and give two examples of Proper Noun and Collective Noun.",
      "What is an Adverb? How does it differ from an Adjective?",
      "Underline the Pronouns in the following sentence: 'She told me that they will visit us tomorrow.'",
      "Explain Transitive and Intransitive Verbs with one example each.",
      "Differentiate between Preposition and Conjunction with examples.",
      "Identify the Parts of Speech of each word in: 'Ah! She sings melodiously.'",
      "What are Action Verbs and Helping Verbs? Give two examples."
    ];

    const longQuestions = [
      "Define all 8 Parts of Speech with suitable examples for each.",
      "Explain the different types of Nouns (Proper, Common, Collective, Material, Abstract) with examples.",
      "What are Degrees of Comparison in Adjectives? Explain Positive, Comparative, and Superlative degrees with five examples.",
      "Discuss Tenses and their relationship with Verbs. Explain Present, Past, and Future simple forms.",
      "Read the passage carefully and classify any 10 words into their respective Parts of Speech."
    ];

    if (mcqCount > 0) {
      html += `<div class="section-title">SECTION A: MULTIPLE CHOICE QUESTIONS</div>`;
      for (let i = 0; i < mcqCount; i++) {
        let item = mcqQuestions[i % mcqQuestions.length];
        html += `<div class="question-item">Q${qNum++}. ${item.q}
          <div class="mcq-options">
            <div>${item.opts[0]}</div><div>${item.opts[1]}</div>
            <div>${item.opts[2]}</div><div>${item.opts[3]}</div>
          </div>
        </div>`;
      }
    }

    if (fillCount > 0) {
      html += `<div class="section-title">SECTION B: FILL IN THE BLANKS</div>`;
      for (let i = 0; i < fillCount; i++) {
        let t = fillQuestions[i % fillQuestions.length];
        html += `<div class="question-item">Q${qNum++}. ${t}</div>`;
      }
    }

    if (shortCount > 0) {
      html += `<div class="section-title">SECTION C: SHORT ANSWER QUESTIONS</div>`;
      for (let i = 0; i < shortCount; i++) {
        let t = shortQuestions[i % shortQuestions.length];
        html += `<div class="question-item">Q${qNum++}. ${t}</div>`;
      }
    }

    if (longCount > 0) {
      html += `<div class="section-title">SECTION D: LONG ANSWER QUESTIONS</div>`;
      for (let i = 0; i < longCount; i++) {
        let t = longQuestions[i % longQuestions.length];
        html += `<div class="question-item">Q${qNum++}. ${t}</div>`;
      }
    }

    document.getElementById('questionsOutput').innerHTML = html;
  }

  function printOrSavePDF() {
    syncHeaderInfo();
    window.print();
  }

  window.onload = function() {
    generateQuestionPaper();
  };
</script>

</body>
</html>
