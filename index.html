<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Paper Generator - Barsoi Public School</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
    body { background: #eef2f5; margin: 0; padding: 10px; color: #111; }

    .control-panel {
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .control-panel h2 { margin-top: 0; color: #004085; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 3px; }
    .form-group input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .full-width { grid-column: span 2; }

    .section-counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      margin-bottom: 12px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: #004085; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn:hover { opacity: 0.9; }

    #fileInput { display: none; }
    #imagePreview { max-height: 60px; display: none; margin-top: 8px; border-radius: 4px; }

    /* Paper Styling */
    .paper-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: white;
      padding: 25px 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      overflow: hidden;
    }

    .school-title { text-align: center; font-size: 20px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
    .exam-title { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

    .meta-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 4px; width: 100%; }
    .instruction { font-style: italic; font-weight: bold; font-size: 12px; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 2px 0; margin: 6px 0 12px 0; text-align: center; width: 100%; }

    .section-title { font-weight: bold; font-size: 12px; margin-top: 10px; margin-bottom: 6px; text-transform: uppercase; background: #f0f0f0; padding: 3px 6px; width: 100%; }
    .question-item { margin-bottom: 8px; font-size: 12px; line-height: 1.35; width: 100%; word-wrap: break-word; }
    .mcq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-left: 15px; margin-top: 3px; font-size: 11.5px; width: 95%; }
    
    .loading-spinner { display: none; color: #004085; font-weight: bold; margin-top: 8px; font-size: 13px; }

    @media print {
      body { padding: 0; background: white; }
      .control-panel { display: none; }
      .paper-container { box-shadow: none; margin: 0; width: 100%; max-width: 100%; padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>🎯 Question Paper Generator Settings</h2>
    
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Exam Name (Center Title)</label>
        <input type="text" id="inputExam" value="ANNUAL EXAMINATION - 2026">
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" id="inputClass" value="Class - XI">
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="inputSubject" value="Science (Biology)">
      </div>
      <div class="form-group">
        <label>Full Marks (FM)</label>
        <input type="text" id="inputFM" value="100">
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="text" id="inputTime" value="2 hrs.">
      </div>
      <div class="form-group full-width">
        <label>Topic Name (Prompt Only - Hidden in Paper)</label>
        <input type="text" id="inputPrompt" value="Photosynthesis in Higher Plants">
      </div>
    </div>

    <label style="font-size: 12px; font-weight: bold; font-family: 'Segoe UI';">Question Quantities (Dynamic):</label>
    <div class="section-counts">
      <div class="form-group">
        <label>MCQs</label>
        <input type="number" id="countMcq" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Fill Blanks</label>
        <input type="number" id="countFill" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Short Qs</label>
        <input type="number" id="countShort" value="7" min="0">
      </div>
      <div class="form-group">
        <label>Long Qs</label>
        <input type="number" id="countLong" value="5" min="0">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📷 / 🖼️ Upload Content</button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
      
      <button class="btn btn-primary" onclick="generateQuestionPaper()">⚡ Generate Paper with AI</button>
      <button class="btn btn-success" onclick="downloadPDF()">📄 Download PDF</button>
    </div>

    <img id="imagePreview" alt="Uploaded Content Preview">
    <div id="loading" class="loading-spinner">⏳ Generating Unique Question Paper... Please wait</div>
  </div>

  <div class="paper-container" id="paperArea">
    <div class="school-title">BARSOI PUBLIC SCHOOL</div>
    <div class="exam-title" id="dispExam">ANNUAL EXAMINATION - 2026</div>

    <div class="meta-row">
      <span>FM - <span id="dispFM">100</span></span>
      <span>Time - <span id="dispTime">2 hrs.</span></span>
    </div>

    <div class="meta-row">
      <span><span id="dispClass">Class - XI</span></span>
      <span>Subject - <span id="dispSubject">Science (Biology)</span></span>
    </div>

    <div class="instruction">All questions are compulsory.</div>

    <div id="questionsOutput"></div>
  </div>

<script>
  const WORKER_URL = "https://barsoi-ai-proxy.barsoipublicschool26.workers.dev/";
  let base64Image = null;

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result.split(',')[1];
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  function syncHeaderInfo() {
    document.getElementById('dispFM').innerText = document.getElementById('inputFM').value;
    document.getElementById('dispTime').innerText = document.getElementById('inputTime').value;
    document.getElementById('dispClass').innerText = document.getElementById('inputClass').value;
    document.getElementById('dispExam').innerText = document.getElementById('inputExam').value;
    document.getElementById('dispSubject').innerText = document.getElementById('inputSubject').value;
  }

  async function generateQuestionPaper() {
    syncHeaderInfo();

    const subject = document.getElementById('inputSubject').value;
    const className = document.getElementById('inputClass').value;
    const topicPrompt = document.getElementById('inputPrompt').value;
    
    const numMcq = parseInt(document.getElementById('countMcq').value) || 0;
    const numFill = parseInt(document.getElementById('countFill').value) || 0;
    const numShort = parseInt(document.getElementById('countShort').value) || 0;
    const numLong = parseInt(document.getElementById('countLong').value) || 0;

    const loading = document.getElementById('loading');
    loading.style.display = 'block';

    const systemPrompt = `You are a school teacher setting an exam.
Write ONLY valid HTML content without markdown formatting (no \`\`\`html).
Every single question MUST be unique and relevant to the topic. Do NOT repeat any question text.

Output structure:
- <div class="section-title">SECTION A: MULTIPLE CHOICE QUESTIONS</div> (${numMcq} distinct MCQs)
  Each MCQ format: <div class="question-item">Q1. Text<div class="mcq-options"><div>(a) A</div><div>(b) B</div><div>(c) C</div><div>(d) D</div></div></div>
- <div class="section-title">SECTION B: FILL IN THE BLANKS</div> (${numFill} distinct questions)
- <div class="section-title">SECTION C: SHORT ANSWER QUESTIONS</div> (${numShort} distinct questions)
- <div class="section-title">SECTION D: LONG ANSWER QUESTIONS</div> (${numLong} distinct questions)

Continuous numbering: Q1 to Q${numMcq + numFill + numShort + numLong}.`;

    const userPrompt = `Class: ${className}, Subject: ${subject}, Topic: ${topicPrompt}.
Create exact unique questions: ${numMcq} MCQs, ${numFill} Fill in Blanks, ${numShort} Short Qs, ${numLong} Long Qs.`;

    try {
      const parts = [{ text: userPrompt }];
      if (base64Image) {
        parts.push({ inline_data: { mime_type: "image/jpeg", data: base64Image } });
      }

      const payload = {
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ parts: parts }]
      };

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("API Server Error");

      const data = await response.json();
      let textOutput = "";

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        textOutput = data.candidates[0].content.parts[0].text;
      }

      if (textOutput && textOutput.trim().length > 100) {
        let formattedHTML = textOutput.replace(/```html/g, '').replace(/```/g, '').trim();
        document.getElementById('questionsOutput').innerHTML = formattedHTML;
      } else {
        generateSmartUniqueQuestions(topicPrompt, numMcq, numFill, numShort, numLong);
      }
    } catch (err) {
      console.warn("API timeout, rendering smart unique questions locally.", err);
      generateSmartUniqueQuestions(topicPrompt, numMcq, numFill, numShort, numLong);
    } finally {
      loading.style.display = 'none';
    }
  }

  // Dynamic unique fallback generator (No repeating text)
  function generateSmartUniqueQuestions(topic, mcqCount, fillCount, shortCount, longCount) {
    let qNum = 1;
    let html = "";

    const mcqTopics = [
      "primary site/organelle involved in",
      "main chemical or biological enzyme required for",
      "fundamental product formed during the initial stage of",
      "cell organelle structurally responsible for regulating",
      "primary energy currency utilized during",
      "type of membrane architecture observed in",
      "key factor that directly accelerates the rate of",
      "primary pigment/component involved in absorbing energy for",
      "by-product released into the atmosphere during",
      "essential mineral/element indispensable for"
    ];

    const fillTopics = [
      "The primary functional unit responsible for light trapping in",
      "Enzyme carboxylase catalyzes the binding stage in",
      "Structural folding in internal membranes increases efficiency during",
      "Synthesis of high-energy chemical bonds mainly occurs within",
      "The transport mechanism regulating substrate entry during",
      "Specialized leaf anatomy adapted for high temperature during",
      "The splitting of water molecules is known as photolysis in"
    ];

    const shortTopics = [
      "Differentiate between Cyclic and Non-cyclic photophosphorylation.",
      "Explain the key role of Chlorophyll 'a' vs Chlorophyll 'b'.",
      "Describe the anatomical features of C4 plant leaves (Kranz Anatomy).",
      "What is Law of Limiting Factors? How does temperature affect it?",
      "Briefly summarize the light-dependent stage reactions.",
      "What is the significance of RuBisCO in carbon fixation?",
      "Explain photorespiration and why it is considered a wasteful pathway."
    ];

    const longTopics = [
      "Describe the Calvin (C3) cycle with a clear schematic diagram showing Carboxylation, Reduction, and Regeneration.",
      "Explain the Hatch and Slack (C4) pathway in detail. Differentiate C3 and C4 plants.",
      "Discuss the Z-scheme of light reaction. Explain ATP synthesis via Chemiosmotic Hypothesis.",
      "Describe the internal ultrastructure of Chloroplast with a neat labeled diagram.",
      "Elaborate on the external and internal factors affecting the overall process of photosynthesis."
    ];

    if (mcqCount > 0) {
      html += `<div class="section-title">SECTION A: MULTIPLE CHOICE QUESTIONS</div>`;
      for (let i = 0; i < mcqCount; i++) {
        let t = mcqTopics[i % mcqTopics.length];
        html += `<div class="question-item">Q${qNum++}. What is the ${t} ${topic}?
          <div class="mcq-options">
            <div>(a) Option A</div><div>(b) Option B</div>
            <div>(c) Option C</div><div>(d) Option D</div>
          </div>
        </div>`;
      }
    }

    if (fillCount > 0) {
      html += `<div class="section-title">SECTION B: FILL IN THE BLANKS</div>`;
      for (let i = 0; i < fillCount; i++) {
        let t = fillTopics[i % fillTopics.length];
        html += `<div class="question-item">Q${qNum++}. ${t} ${topic} is ____________.</div>`;
      }
    }

    if (shortCount > 0) {
      html += `<div class="section-title">SECTION C: SHORT ANSWER QUESTIONS</div>`;
      for (let i = 0; i < shortCount; i++) {
        let t = shortTopics[i % shortTopics.length];
        html += `<div class="question-item">Q${qNum++}. ${t}</div>`;
      }
    }

    if (longCount > 0) {
      html += `<div class="section-title">SECTION D: LONG ANSWER QUESTIONS</div>`;
      for (let i = 0; i < longCount; i++) {
        let t = longTopics[i % longTopics.length];
        html += `<div class="question-item">Q${qNum++}. ${t}</div>`;
      }
    }

    document.getElementById('questionsOutput').innerHTML = html;
  }

  function downloadPDF() {
    syncHeaderInfo();
    const element = document.getElementById('paperArea');
    const opt = {
      margin:       5,
      filename:     `Question_Paper_${document.getElementById('inputSubject').value}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, windowWidth: 800 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }

  window.onload = function() {
    generateQuestionPaper();
  };
</script>

</body>
</html>
