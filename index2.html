<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Paper Generator - Barsoi Public School</title>

  <style>
    * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif; }
    body { background: #eef2f5; margin: 0; padding: 10px; color: #111; }

    .control-panel {
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .control-panel h2 { margin-top: 0; color: #004085; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 3px; }
    .form-group input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .full-width { grid-column: span 2; }

    .section-counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      margin-bottom: 12px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
    .btn-primary { background: #004085; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn:hover { opacity: 0.9; }

    #fileInput { display: none; }
    
    .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .thumbnail-box { position: relative; width: 60px; height: 60px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; background: #f8f9fa; }
    .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }

    /* Paper Styling */
    .paper-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: white;
      padding: 25px 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      overflow: hidden;
    }

    .school-title { text-align: center; font-size: 20px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
    .exam-title { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

    .meta-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 4px; width: 100%; }
    .instruction { font-style: italic; font-weight: bold; font-size: 12px; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 2px 0; margin: 6px 0 12px 0; text-align: center; width: 100%; }

    .section-title { font-weight: bold; font-size: 12px; margin-top: 10px; margin-bottom: 6px; text-transform: uppercase; background: #f0f0f0; padding: 3px 6px; width: 100%; }
    .question-item { margin-bottom: 8px; font-size: 12px; line-height: 1.35; width: 100%; word-wrap: break-word; }
    .mcq-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-left: 15px; margin-top: 3px; font-size: 11.5px; width: 95%; }
    
    .loading-spinner { display: none; color: #004085; font-weight: bold; margin-top: 8px; font-size: 13px; }

    @media print {
      body { padding: 0; background: white; }
      .control-panel { display: none !important; }
      .paper-container { box-shadow: none; margin: 0; width: 100%; max-width: 100%; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>🎯 Question Paper Generator Settings</h2>
    
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Exam Name (Center Title)</label>
        <input type="text" id="inputExam" value="ANNUAL EXAMINATION - 2026">
      </div>
      <div class="form-group">
        <label>Class</label>
        <input type="text" id="inputClass" value="Class - VI">
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="inputSubject" value="English">
      </div>
      <div class="form-group">
        <label>Full Marks (FM)</label>
        <input type="text" id="inputFM" value="100">
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="text" id="inputTime" value="2 hrs.">
      </div>
      <div class="form-group full-width">
        <label>Chapter / Instructions / Topic Note</label>
        <input type="text" id="inputPrompt" value="Poorvi Grade 6 - Rama Natha and the Magic Potion">
      </div>
    </div>

    <label style="font-size: 12px; font-weight: bold; font-family: 'Segoe UI';">Question Quantities (Dynamic):</label>
    <div class="section-counts">
      <div class="form-group">
        <label>MCQs</label>
        <input type="number" id="countMcq" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Fill Blanks</label>
        <input type="number" id="countFill" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Short Qs</label>
        <input type="number" id="countShort" value="5" min="0">
      </div>
      <div class="form-group">
        <label>Long Qs</label>
        <input type="number" id="countLong" value="3" min="0">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Select Multiple Pages / Chapter Photos</button>
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)">
      
      <button class="btn btn-primary" onclick="generateQuestionPaper()">⚡ Generate Paper with AI</button>
      <button class="btn btn-success" onclick="printOrSavePDF()">🖨️ Print / Save as PDF</button>
    </div>

    <div id="imagePreviewContainer" class="preview-container"></div>
    <div id="loading" class="loading-spinner">⏳ Reading Chapters / Handwritten Images & Generating Paper... Please wait</div>
  </div>

  <div class="paper-container" id="paperArea">
    <div class="school-title">BARSOI PUBLIC SCHOOL</div>
    <div class="exam-title" id="dispExam">ANNUAL EXAMINATION - 2026</div>

    <div class="meta-row">
      <span>FM - <span id="dispFM">100</span></span>
      <span>Time - <span id="dispTime">2 hrs.</span></span>
    </div>

    <div class="meta-row">
      <span><span id="dispClass">Class - VI</span></span>
      <span>Subject - <span id="dispSubject">English</span></span>
    </div>

    <div class="instruction">All questions are compulsory.</div>

    <div id="questionsOutput"></div>
  </div>

<script>
  const WORKER_URL = "https://barsoi-ai-proxy.barsoipublicschool26.workers.dev/";
  let uploadedImages = []; // Array to hold multiple images

  function handleFileSelect(event) {
    const files = event.target.files;
    const previewContainer = document.getElementById('imagePreviewContainer');
    previewContainer.innerHTML = '';
    uploadedImages = [];

    if (files && files.length > 0) {
      Array.from(files).forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(',')[1];
          uploadedImages.push({
            inline_data: {
              mime_type: file.type || "image/jpeg",
              data: base64Data
            }
          });

          // Render Thumbnail
          const box = document.createElement('div');
          box.className = 'thumbnail-box';
          box.innerHTML = `<img src="${e.target.result}" alt="Page ${index+1}">`;
          previewContainer.appendChild(box);
        };
        reader.readAsDataURL(file);
      });
    }
  }

  function syncHeaderInfo() {
    document.getElementById('dispFM').innerText = document.getElementById('inputFM').value;
    document.getElementById('dispTime').innerText = document.getElementById('inputTime').value;
    document.getElementById('dispClass').innerText = document.getElementById('inputClass').value;
    document.getElementById('dispExam').innerText = document.getElementById('inputExam').value;
    document.getElementById('dispSubject').innerText = document.getElementById('inputSubject').value;
  }

  async function generateQuestionPaper() {
    syncHeaderInfo();

    const subject = document.getElementById('inputSubject').value;
    const className = document.getElementById('inputClass').value;
    const topicPrompt = document.getElementById('inputPrompt').value;
    
    const numMcq = parseInt(document.getElementById('countMcq').value) || 0;
    const numFill = parseInt(document.getElementById('countFill').value) || 0;
    const numShort = parseInt(document.getElementById('countShort').value) || 0;
    const numLong = parseInt(document.getElementById('countLong').value) || 0;

    const loading = document.getElementById('loading');
    loading.style.display = 'block';

    const systemPrompt = `You are an expert school examination question paper creator. 

CRITICAL INSTRUCTIONS FOR IMAGE PROCESSING:
1. IF THE UPLOADED IMAGES ARE TEXTBOOK CHAPTERS / STORIES: Thoroughly read and comprehend the text, characters, events, and vocabulary from ALL provided pages. Generate high-quality examination questions STRICTLY based on the story/lesson content.
2. IF THE UPLOADED IMAGES ARE HANDWRITTEN QUESTION PAPERS: Transcribe and convert them word-for-word (hoo bahoo) into the clean question paper format.
3. OUTPUT FORMAT: Return ONLY clean raw HTML code without any markdown wrappers like \`\`\`html.

Required Sections Structure & Counts:
${numMcq > 0 ? `<div class="section-title">SECTION A: MULTIPLE CHOICE QUESTIONS</div> (${numMcq} MCQs)` : ''}
${numFill > 0 ? `<div class="section-title">SECTION B: FILL IN THE BLANKS</div> (${numFill} questions)` : ''}
${numShort > 0 ? `<div class="section-title">SECTION C: SHORT ANSWER QUESTIONS</div> (${numShort} questions)` : ''}
${numLong > 0 ? `<div class="section-title">SECTION D: LONG ANSWER QUESTIONS</div> (${numLong} questions)` : ''}

MCQ format: <div class="question-item">Q1. Question text<div class="mcq-options"><div>(a) Option 1</div><div>(b) Option 2</div><div>(c) Option 3</div><div>(d) Option 4</div></div></div>
Number all questions continuously from Q1 to the total count. Ensure absolute relevance to the provided chapter/text.`;

    const userPrompt = `Class: ${className}, Subject: ${subject}, Topic/Context: ${topicPrompt}. Generate exact questions based on the attached page(s). Counts: MCQs=${numMcq}, FillBlanks=${numFill}, Short=${numShort}, Long=${numLong}.`;

    try {
      // Build content parts with text prompt + all uploaded images
      const parts = [{ text: userPrompt }];
      if (uploadedImages.length > 0) {
        uploadedImages.forEach(img => {
          parts.push(img);
        });
      }

      const payload = {
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ parts: parts }]
      };

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error("Worker Response Failed");

      const data = await response.json();
      let textOutput = "";

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        textOutput = data.candidates[0].content.parts[0].text;
      }

      if (textOutput && textOutput.trim().length > 50) {
        let formattedHTML = textOutput.replace(/```html/g, '').replace(/```/g, '').trim();
        document.getElementById('questionsOutput').innerHTML = formattedHTML;
      } else {
        throw new Error("Empty AI Output");
      }
    } catch (err) {
      console.warn("AI Generation Error:", err);
      document.getElementById('questionsOutput').innerHTML = `<div style="color:red; text-align:center; padding:15px; font-weight:bold;">⚠️ AI could not process the images or connection timed out. Please check your network or try uploading clearer images.</div>`;
    } finally {
      loading.style.display = 'none';
    }
  }

  function printOrSavePDF() {
    syncHeaderInfo();
    window.print();
  }
</script>

</body>
</html>
